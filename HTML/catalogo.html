<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="../CSS/catalogo.css">
</head>

<body>
    <header>
        <div class="logo">
            <h1>Biblioteca Digital</h1>
        </div>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="autores.html">Autores</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="estadisticas.html">Estadísticas</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main>
        <section class="titulo-catalogo">
            <h2>Catálogo de libros</h2>
            <p>Explora los libros disponibles en la biblioteca.</p>
        </section>
        <section class="busqueda">
            <input type="text" id="buscarLibro" placeholder="Buscar libro por título...">
        </section>
        <section class="tabla-catalogo">
            <table>
                <thead>
                    <tr>
                        <th>Portada</th>
                        <th>Titulo</th>
                        <th>Autor</th>
                        <th>Género</th>
                        <th>Año</th>
                    </tr>
                </thead>
                <tbody id="tablaLibros"></tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>Biblioteca Digital</p>
    </footer>
    <script src="../JavaScript/catalogo.js"></script>
</body>

</html>
