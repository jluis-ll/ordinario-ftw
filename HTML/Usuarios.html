<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" href="../CSS/usuarios.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Biblioteca Digital</h1>
        </div>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="autores.html">Autores</a>
            <a href="favoritos.html">Favoritos</a>

            <a href="contacto.html">Contacto</a>

        </nav>

    <main>

        <section class="titulo-usuarios">
            <h2>Usuarios</h2>
            <p>Lista de usuarios registrados en la biblioteca digital.</p>
        </section>

        <section class="busqueda">
            <input type="text" id="buscarUsuario" placeholder="Buscar usuario por nombre o correo electrónico...">
            <button id="btnBuscar">Buscar</button>
        </section>

        <section class="tabla-usuarios">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo electrónico</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Biblioteca Digital</p>
    </footer>

    <script src="../JavaScript/usuarios.js"></script>
